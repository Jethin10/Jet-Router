services:
  jet-router:
    build:
      context: .
      dockerfile: Dockerfile
    image: ghcr.io/jethin10/jet-router:latest
    container_name: jet-router
    restart: unless-stopped
    init: true
    ports:
      - "${JET_ROUTER_BIND_ADDRESS:-127.0.0.1}:${PORT:-20128}:20128"
    volumes:
      - jet-router-data:/app/data
    env_file:
      - .env
    environment:
      DATA_DIR: /app/data
      PORT: "20128"
      HOSTNAME: "0.0.0.0"
      NODE_ENV: production
      HEADROOM_URL: http://headroom:8787
    healthcheck:
      test: ["CMD", "node", "-e", "fetch('http://127.0.0.1:20128/api/health').then(r=>{if(!r.ok)process.exit(1)}).catch(()=>process.exit(1))"]
      interval: 30s
      timeout: 5s
      start_period: 30s
      retries: 3
    security_opt:
      - no-new-privileges:true
    stop_grace_period: 30s
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

  headroom:
    image: ghcr.io/chopratejas/headroom:latest
    container_name: headroom
    restart: unless-stopped
    profiles: ["token-saver"]
    expose:
      - "8787"
    security_opt:
      - no-new-privileges:true
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"

volumes:
  jet-router-data:
    name: jet-router-data
